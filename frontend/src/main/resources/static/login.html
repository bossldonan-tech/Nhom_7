<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dang nhap - PTPMHDV Shop</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="site-header" class="site-header"></header>

<main class="container">
    <div class="auth-box card">
        <h2>Dang nhap</h2>
        <div id="error-box"></div>
        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Ten dang nhap</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-group">
                <label>Mat khau</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Dang nhap</button>
        </form>
        <p style="margin-top:14px; font-size:14px;">
            Chua co tai khoan? <a href="register.html" style="color:var(--primary)">Dang ky ngay</a>
        </p>
        <p style="font-size:12px; color:var(--muted)">
            Tai khoan mau: <strong>admin / admin123</strong> (quan tri) hoac <strong>khachhang / 123456</strong> (nguoi mua)
        </p>
    </div>
</main>

<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script src="js/auth.js"></script>
<script>renderHeader("login");</script>
</body>
</html>
