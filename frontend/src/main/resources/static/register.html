<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dang ky - PTPMHDV Shop</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="site-header" class="site-header"></header>

<main class="container">
    <div class="auth-box card">
        <h2>Tao tai khoan moi</h2>
        <div id="error-box"></div>
        <form onsubmit="handleRegister(event)">
            <div class="form-group">
                <label>Ten dang nhap</label>
                <input type="text" id="username" required minlength="3">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Mat khau</label>
                <input type="password" id="password" required minlength="6">
            </div>
            <div class="form-group">
                <label>Ho va ten</label>
                <input type="text" id="fullName" required>
            </div>
            <div class="form-group">
                <label>So dien thoai</label>
                <input type="text" id="phone">
            </div>
            <div class="form-group">
                <label>Dia chi</label>
                <input type="text" id="address">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Dang ky</button>
        </form>
        <p style="margin-top:14px; font-size:14px;">
            Da co tai khoan? <a href="login.html" style="color:var(--primary)">Dang nhap</a>
        </p>
    </div>
</main>

<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script src="js/auth.js"></script>
<script>renderHeader("register");</script>
</body>
</html>
